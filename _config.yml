plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - CONTRIBUTING.md
  - index.md
  - LICENSE.md
  - COPYING.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md
exclude:
  - README.md
  - TODO.md
  - map
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
- jekyll-remote-theme 

color_scheme: dark-mod
aux_links:
  "Send a pull request":
    - "//github.com/zhol0777/is-this-good"

